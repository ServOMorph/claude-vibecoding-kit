<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Mascotte — prototype écran ASCII</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="visionneuse">
      <div class="vues" id="vues">
        <div class="vue">
          <div id="crt-contenant" class="crt-contenant">
            <div id="crt" class="crt">
              <pre id="screen" class="screen"></pre>
              <div class="scanlines"></div>
            </div>
          </div>
          <div id="flags-a" class="flags-panel" hidden></div>
        </div>
        <div class="vue" id="vue-b" hidden>
          <div id="crt-contenant-b" class="crt-contenant">
            <div id="crt-b" class="crt">
              <pre id="screen-b" class="screen"></pre>
              <div class="scanlines"></div>
            </div>
          </div>
          <div id="flags-b" class="flags-panel" hidden></div>
        </div>
      </div>

      <div class="controls">
        <label>
          Vitesse relative
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
        </label>
        <label>
          Taille écran
          <select id="taille-ecran">
            <option value="1">100%</option>
            <option value="0.75" selected>75%</option>
            <option value="0.5">50%</option>
            <option value="linkedin">LinkedIn (1080x1050 px)</option>
          </select>
        </label>
        <label class="texte-label">
          Texte (machine à écrire / générique)
          <input type="text" id="texte-source" value="Lancement du programme en cours..." />
        </label>
        <label class="compare-toggle">
          <input type="checkbox" id="mode-comparaison" />
          Comparer A/B
        </label>
        <button id="toggle">Pause</button>
        <div class="groupe-boutons-clip">
          <button id="jouer-montage-codex" class="primaire codex">Lire : Le hibou perdu dans l'IA — Codex (35,5s)</button>
          <button class="exporter-clip-btn" data-montage="hibou_perdu_ia_codex">Exporter</button>
        </div>
        <div class="groupe-boutons-clip">
          <button id="jouer-montage-plans" class="primaire">Lire : Plans du hibou (34,5s)</button>
          <button class="exporter-clip-btn" data-montage="hibou_plans_cinema">Exporter</button>
        </div>
        <div class="groupe-boutons-clip">
          <button id="jouer-montage-logo-codex" class="primaire codex">Lire : Logo SérénIA Tech — Codex (10s)</button>
          <button class="exporter-clip-btn" data-montage="logo_serenia_clip_codex">Exporter</button>
        </div>
        <div class="groupe-boutons-clip">
          <button id="jouer-montage-promo-linkedin" class="primaire codex">Lire : Promo LinkedIn (16s)</button>
          <button class="exporter-clip-btn" data-montage="promo_linkedin_clip">Exporter</button>
        </div>
        <div class="groupe-boutons-clip">
          <button id="jouer-montage-promo-explosive" class="primaire codex" style="background: #1a4231; border-color: #3ba677; color: #a3ffd2;">Lire : Promo Explosive (15s)</button>
          <button class="exporter-clip-btn" data-montage="promo_explosive_clip">Exporter</button>
        </div>
      </div>
    </section>

    <section class="bibliotheque">
      <input type="text" id="recherche" class="recherche" placeholder="Rechercher une animation (nom, catégorie, tag)..." autocomplete="off" />
      <div id="resultats" class="resultats"></div>
    </section>
  </main>

   <script src="animations/version.js"></script>
  <script src="animations/config_rendu.js"></script>
  <script src="animations/registry.js"></script>
  <script src="animations/montage.js"></script>
  <script src="animations/animations_base.js"></script>
  <script src="animations/animations_variantes.js"></script>
  <script src="animations/animations_plans.js"></script>
  <script src="animations/animations_logo.js"></script>
  <script src="animations/animations_codex.js"></script>
  <script src="animations/animations_promo.js"></script>
  <script src="app.js"></script>
</body>
</html>
