<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Code Bridge</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-alt: #1a1d24;
    --fg: #e6e6e6;
    --muted: #8a8f98;
    --accent: #3b82f6;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid #22252c;
    flex-shrink: 0;
  }
  #connDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--err);
    flex-shrink: 0;
  }
  #connDot.connected { background: var(--ok); }
  #stateLabel {
    margin-left: auto;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 11px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--bg-alt);
    color: var(--fg);
    border-bottom-left-radius: 4px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid #22252c;
    flex-shrink: 0;
  }
  #textInput {
    flex: 1;
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn:active { opacity: 0.7; }
  #sendBtn:disabled { opacity: 0.4; }

  #micBtn {
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #micBtn:active { opacity: 0.7; }

  #voiceScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 50;
  }
  #voiceScreen.active { display: flex; }

  .voiceCircle {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2447c9, #0b1440 70%);
    box-shadow: 0 0 60px 20px rgba(37, 99, 235, 0.55), 0 0 120px 60px rgba(37, 99, 235, 0.25);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .voiceCircle.done {
    animation: none;
    box-shadow: 0 0 60px 20px rgba(34, 197, 94, 0.55), 0 0 120px 60px rgba(34, 197, 94, 0.25);
    background: radial-gradient(circle at 35% 30%, #16a34a, #052e16 70%);
  }
  .voiceCircle.thinking {
    box-shadow: 0 0 60px 20px rgba(249, 115, 22, 0.55), 0 0 120px 60px rgba(249, 115, 22, 0.25);
    background: radial-gradient(circle at 35% 30%, #ea580c, #431407 70%);
  }
  .voiceCircle.paused {
    animation: none;
    box-shadow: 0 0 40px 10px rgba(138, 143, 152, 0.35);
    background: radial-gradient(circle at 35% 30%, #4b5563, #1f2937 70%);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  #voiceStatus {
    color: var(--fg);
    font-size: 16px;
    text-align: center;
    padding: 0 32px;
    min-height: 24px;
  }

  #voiceCancel {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: 20px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }

  #voicePause {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 20px;
    background: none;
    border: 1px solid var(--muted);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <header>
    <span id="connDot"></span>
    <span id="connLabel">Deconnecte</span>
    <span id="stateLabel"></span>
  </header>

  <div id="chat"></div>

  <form id="composer">
    <input id="textInput" type="text" placeholder="Ecrire un message..." autocomplete="off">
    <button id="micBtn" type="button">mic</button>
    <button id="sendBtn" type="submit">-></button>
  </form>

  <div id="voiceScreen">
    <button id="voicePause" type="button">Pause micro</button>
    <button id="voiceCancel" type="button">Annuler</button>
    <div class="voiceCircle" id="voiceCircle"></div>
    <div id="voiceStatus">Je vous ecoute...</div>
  </div>

  <audio id="assistantAudio" playsinline style="display:none"></audio>

  <script src="app.js"></script>
</body>
</html>
